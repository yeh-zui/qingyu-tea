<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晴嶼茶研｜下午茶訂購</title><style>
:root{--navy:#123c63;--blue:#197fc5;--sky:#e8f7ff;--line:#c5e5f8;--muted:#55728a;--orange:#ffb443}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#e8f7ff 0,#f8fcff 55%,#eaf7ff 100%);color:var(--navy);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;min-height:100vh}main{width:min(1120px,calc(100% - 32px));margin:0 auto;padding:28px 0 56px}.brand{display:flex;align-items:center;gap:14px}.mark{width:56px;height:56px;border-radius:19px;background:linear-gradient(135deg,#ffca59,#f89f31);box-shadow:0 9px 18px #ed9d3336;display:grid;place-items:center;color:white;font-size:27px;font-weight:900;position:relative}.mark:before{content:"";position:absolute;inset:7px;border:2px solid #fff9;border-radius:15px}.brand h1{font-size:24px;margin:0;letter-spacing:.06em}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}.hero{display:flex;justify-content:space-between;gap:28px;align-items:center;margin:28px 0 20px;padding:26px 30px;border:1px solid #fff;border-radius:28px;background:linear-gradient(125deg,#167ac0,#42aae4);color:#fff;box-shadow:0 18px 40px #187cc229}.hero h2{font-size:30px;margin:0 0 8px}.hero p{margin:0;color:#e9f8ff}.sun{width:102px;height:102px;border-radius:50%;background:#ffe19a;box-shadow:0 0 0 14px #fff2,0 0 0 28px #fff1;flex:none}.steps{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.step{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;color:#35739b;font-size:13px;font-weight:700}.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(330px,.8fr);gap:22px;align-items:start}.panel{background:#fff;border:1px solid #fff;border-radius:22px;padding:22px;box-shadow:0 10px 30px #187cc212}.panel h3{margin:0;font-size:18px}.panel-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px}.panel-head p{margin:4px 0 0;color:var(--muted);font-size:13px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 16px}.filter{border:1px solid var(--line);background:#f4fbff;color:#34779f;padding:7px 11px;border-radius:999px;font:700 13px inherit;cursor:pointer}.filter.active{background:var(--blue);border-color:var(--blue);color:#fff}.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.drink-card{appearance:none;text-align:left;border:1px solid var(--line);background:linear-gradient(145deg,#fff,#f5fbff);border-radius:15px;padding:14px;cursor:pointer;min-height:102px;transition:.16s}.drink-card:hover{border-color:var(--blue);box-shadow:0 7px 17px #197fc521;transform:translateY(-1px)}.drink-card small{display:block;color:#4c89ac;font-weight:700}.drink-card strong{display:block;margin:6px 0;font-size:16px}.price{color:#ee8d24;font-weight:900;font-size:13px}.cart{position:sticky;top:18px}.cart-title{display:flex;justify-content:space-between;align-items:center}.count{border-radius:999px;background:#e3f5ff;color:#1773a9;padding:3px 9px;font-size:12px;font-weight:900}.cart-list{margin-top:11px}.cart-row{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid #e8f1f6}.cart-row:last-child{border-bottom:0}.cart-row .info{flex:1}.cart-row strong,.cart-row span{display:block}.cart-row span{font-size:12px;color:var(--muted);margin-top:3px}.remove{border:0;background:#fff2e9;color:#d56c20;padding:6px 9px;border-radius:9px;font:800 12px inherit;cursor:pointer}.checkout{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}.field{display:block;margin-top:14px;color:#285775;font-size:13px;font-weight:800}.field input,.field select,.field textarea{width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;color:var(--navy);font:inherit;background:#fff}.field textarea{height:76px;resize:vertical}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary,.secondary{font:800 15px inherit;cursor:pointer;border-radius:12px;padding:12px 14px}.primary{width:100%;border:0;background:var(--blue);color:#fff;margin-top:18px;box-shadow:0 8px 15px #197fc530}.primary:disabled{opacity:.55;cursor:wait}.secondary{border:1px solid var(--line);background:#fff;color:#2573a5}.notice{margin-top:12px;padding:12px;border-radius:11px;background:#e8f7ff;color:#176da5;font-weight:800;font-size:14px}.notice.error{background:#fff0ed;color:#a33e2e}.admin-toggle{margin:22px auto 0;display:block;border:0;background:transparent;color:#4f89ae;text-decoration:underline;cursor:pointer}.admin{margin-top:14px}.admin.hidden,.modal.hidden{display:none}.table-wrap{overflow:auto;margin-top:14px}.details{border-collapse:collapse;width:100%;font-size:13px}.details th,.details td{border-bottom:1px solid var(--line);padding:9px;text-align:left;vertical-align:top;white-space:nowrap}.details th{color:#2877a8}.empty{padding:18px 0;color:var(--muted);font-size:14px}.footer{text-align:center;color:#6c91a8;font-size:12px;margin-top:28px}.footer strong{color:#2578ac}.modal{position:fixed;inset:0;background:#0c426b8f;z-index:20;display:grid;place-items:center;padding:16px}.modal-card{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:25px;padding:25px;box-shadow:0 24px 70px #06345366;position:relative}.close{position:absolute;right:16px;top:16px;border:0;border-radius:50%;width:34px;height:34px;background:#edf8ff;color:#2675a5;font-size:22px;cursor:pointer}.modal-title{margin:0;font-size:25px;padding-right:42px}.modal-price{margin:5px 0 15px;color:#e88921;font-weight:900}.modal .field-grid{gap:12px}.modal .primary{margin-top:20px}@media(max-width:800px){.layout{grid-template-columns:1fr}.cart{position:static}.hero{padding:23px}.hero h2{font-size:25px}}@media(max-width:520px){main{width:min(100% - 22px,1120px);padding-top:16px}.hero{padding:20px}.sun{width:65px;height:65px}.hero h2{font-size:21px}.menu-grid{grid-template-columns:1fr}.field-grid{grid-template-columns:1fr}.panel{padding:18px}}
</style></head><body><main>
<header class="brand"><div class="mark">晴</div><div><h1>晴嶼茶研</h1><p>晴嶼茶研 · 把晴天封進每一杯</p></div></header><section class="hero"><div><h2>今天，喝一杯晴天吧。</h2><p>點擊飲料，立即在彈出卡片中完成甜度、冰塊與數量設定。</p></div><div class="sun" aria-hidden="true"></div></section><div class="steps"><span class="step">1. 點飲料</span><span class="step">2. 直接客製</span><span class="step">3. 多杯加購</span><span class="step">4. 一次送出</span></div>
<div class="layout"><section class="panel"><div class="panel-head"><div><h3>菜單</h3><p>價格顯示中杯／大杯；點選卡片直接客製。</p></div></div><div id="filters" class="filters"></div><div id="menu" class="menu-grid"></div></section><aside class="cart panel"><div class="cart-title"><h3>本次訂單</h3><span id="count" class="count">0 杯</span></div><div id="cart" class="cart-list"><div class="empty">尚未加入飲料。</div></div><div class="checkout"><div class="field-grid"><label class="field">訂購人姓名（必填）<input id="name" maxlength="40" placeholder="例如：王小明"></label><label class="field">電話（選填）<input id="phone" maxlength="30" inputmode="tel" placeholder="例如：0912-345-678"></label></div><button id="checkout" class="primary" type="button">確認所有品項並送出訂單</button><div id="message" class="notice" hidden></div></div></aside></div>
<button id="adminToggle" class="admin-toggle" type="button">幹事後台：查看訂購明細與發送核對</button><section id="admin" class="panel admin hidden"><h3>幹事後台</h3><p class="empty">在本機試用模式中，這裡會顯示此裝置暫存的訂單；正式連線 Google Sheet 後可同步查看完整後台。</p><div><button id="loadOrders" class="secondary" type="button">訂購明細</button><button id="loadDistribution" class="secondary" type="button">發送核對</button></div><div id="adminResult"></div></section><footer class="footer">晴嶼茶研為本網站原創示範品牌；菜單可由主辦人於 <strong>Google Sheet</strong> 後台調整。</footer>
</main><div id="customizer" class="modal hidden"><div class="modal-card"><button id="closeModal" class="close" type="button" aria-label="關閉">×</button><h2 id="modalName" class="modal-title"></h2><div id="modalPrice" class="modal-price"></div><div class="field-grid"><label class="field">甜度<select id="sugar"><option value="">請選擇</option><option>正常糖</option><option>少糖</option><option>半糖</option><option>微糖</option><option>一分糖</option><option>無糖</option></select></label><label class="field">冰塊<select id="ice"><option value="">請選擇</option><option>正常冰</option><option>少冰</option><option>微冰</option><option>去冰</option><option>常溫</option><option>熱</option></select></label></div><label class="field">數量<input id="quantity" type="number" value="1" min="1" max="10"></label><label class="field">備註（選填）<textarea id="note" maxlength="200" placeholder="例如：請分開裝、不要吸管"></textarea></label><button id="add" class="primary" type="button">加入本次訂單</button></div></div>
<script>
const fallbackMenu=[['茉莉綠茶','找好茶','M30 / L35'],['阿薩姆紅茶','找好茶','M30 / L35'],['四季春青茶','找好茶','M30 / L35'],['黃金烏龍','找好茶','M30 / L35'],['檸檬綠','找好茶','M35 / L45'],['梅の綠','找好茶','M35 / L45'],['8冰綠','找好茶','M40 / L55'],['桔子綠','找好茶','M40 / L55'],['奶茶','找奶茶','M40 / L55'],['奶綠','找奶茶','M40 / L55'],['烏龍奶茶','找奶茶','M40 / L55'],['珍珠奶茶','找奶茶','M45 / L60'],['波霸奶茶','找奶茶','M45 / L60'],['紅茶拿鐵','找拿鐵','M50 / L65'],['烏龍拿鐵','找拿鐵','M50 / L65'],['珍珠紅茶拿鐵','找拿鐵','M55 / L75'],['旺來綠','找新鮮','M40 / L55'],['柚子綠','找新鮮','M45 / L60'],['鮮柚綠','找新鮮','M50 / L65'],['檸檬多多','季節限定','M50 / L65'],['蜂蜜檸檬','季節限定','M55 / L75']].map(([name,category,price])=>({name,category,price}));
const $=id=>document.getElementById(id),esc=value=>String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[char]));let menu=[...fallbackMenu],activeCategory='全部',selected=null,cart=[];const storeKey='qingyu-tea-local-orders-v1';const localOrders=()=>JSON.parse(localStorage.getItem(storeKey)||'[]');const saveLocalOrders=rows=>localStorage.setItem(storeKey,JSON.stringify(rows));
async function api(action,options={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const response=await fetch(`/api?action=${action}`,{...options,signal:controller.signal,headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=await response.json();if(!response.ok)throw new Error(data.error||'系統錯誤');return data}catch(error){if(error.name==='AbortError')throw new Error('後台連線逾時');throw error}finally{clearTimeout(timer)}}function notice(text,error=false){const box=$('message');box.hidden=false;box.textContent=text;box.className=`notice${error?' error':''}`}
function renderMenu(){const categories=['全部',...new Set(menu.map(item=>item.category))];$('filters').innerHTML=categories.map(category=>`<button type="button" class="filter ${category===activeCategory?'active':''}" data-category="${esc(category)}">${esc(category)}</button>`).join('');$('filters').querySelectorAll('button').forEach(button=>button.onclick=()=>{activeCategory=button.dataset.category;renderMenu()});const visible=activeCategory==='全部'?menu:menu.filter(item=>item.category===activeCategory);$('menu').innerHTML=visible.map(item=>`<button type="button" class="drink-card" data-name="${esc(item.name)}"><small>${esc(item.category)}</small><strong>${esc(item.name)}</strong><span class="price">${esc(item.price)}</span></button>`).join('');$('menu').querySelectorAll('.drink-card').forEach(button=>button.onclick=()=>openModal(menu.find(item=>item.name===button.dataset.name)))}
function openModal(item){selected=item;$('modalName').textContent=item.name;$('modalPrice').textContent=item.price;$('sugar').value='';$('ice').value='';$('quantity').value=1;$('note').value='';$('customizer').classList.remove('hidden')}function closeModal(){$('customizer').classList.add('hidden');selected=null}$('closeModal').onclick=closeModal;$('customizer').addEventListener('click',event=>{if(event.target===$('customizer'))closeModal()});
function renderCart(){const cups=cart.reduce((total,item)=>total+Number(item.quantity),0);$('count').textContent=`${cups} 杯`;$('cart').innerHTML=cart.length?cart.map((item,index)=>`<div class="cart-row"><div class="info"><strong>${esc(item.drink)} × ${item.quantity}</strong><span>${esc(item.price)}｜${esc(item.sugar)}・${esc(item.ice)}${item.note?'｜'+esc(item.note):''}</span></div><button class="remove" type="button" data-index="${index}">移除</button></div>`).join(''):'<div class="empty">尚未加入飲料。</div>';$('cart').querySelectorAll('.remove').forEach(button=>button.onclick=()=>{cart.splice(Number(button.dataset.index),1);renderCart()})}
$('add').onclick=()=>{const sugar=$('sugar').value,ice=$('ice').value,quantity=Number($('quantity').value);if(!selected||!sugar||!ice||!Number.isInteger(quantity)||quantity<1||quantity>10){alert('請完整選擇甜度、冰塊與 1 至 10 杯的數量。');return}cart.push({drink:selected.name,price:selected.price,sugar,ice,quantity,note:$('note').value.trim()});renderCart();closeModal();notice(`已加入：${selected.name}`)};
function saveOrderLocally(name,phone,items){const batch=`LOCAL-${Date.now()}`;const time=new Date().toLocaleString('zh-TW');const rows=items.map((item,index)=>({orderNo:`${batch}-${String(index+1).padStart(2,'0')}`,time,name,phone,category:menu.find(x=>x.name===item.drink)?.category||'',...item,status:'待發送'}));saveLocalOrders([...localOrders(),...rows]);return batch}
$('checkout').onclick=async()=>{const name=$('name').value.trim(),phone=$('phone').value.trim();if(!name)return notice('訂購人姓名為必填，請填寫後再送出。',true);if(!cart.length)return notice('請至少完成一杯飲料的選購。',true);$('checkout').disabled=true;notice('正在送出所有品項…');try{const result=await api('order',{method:'POST',body:JSON.stringify({name,phone,items:cart})});cart=[];$('name').value='';$('phone').value='';renderCart();notice(result.message)}catch(error){const batch=saveOrderLocally(name,phone,cart);cart=[];$('name').value='';$('phone').value='';renderCart();notice(`目前未連線後台，訂單已暫存於此裝置。編號：${batch}`)}finally{$('checkout').disabled=false}};
$('adminToggle').onclick=()=>$('admin').classList.toggle('hidden');function renderOrders(rows,distribution=false){const target=$('adminResult');if(!rows.length){target.innerHTML='<div class="empty">目前還沒有本機暫存訂單。</div>';return}target.innerHTML=distribution?`<div class="table-wrap"><table class="details"><thead><tr><th>姓名</th><th>飲料</th><th>數量</th><th>甜度／冰塊</th><th>狀態</th><th></th></tr></thead><tbody>${rows.map(row=>`<tr><td>${esc(row.name)}</td><td>${esc(row.drink)}</td><td>${row.quantity}</td><td>${esc(row.sugar)}／${esc(row.ice)}</td><td>${esc(row.status)}</td><td>${row.status==='已發送'?'已完成':`<button class="remove deliver" data-order="${esc(row.orderNo)}">確認發送</button>`}</td></tr>`).join('')}</tbody></table></div>`:`<div class="table-wrap"><table class="details"><thead><tr><th>時間</th><th>姓名／電話</th><th>飲料</th><th>數量</th><th>甜度／冰塊</th><th>備註</th><th>狀態</th></tr></thead><tbody>${rows.map(row=>`<tr><td>${esc(row.time)}</td><td>${esc(row.name)}<br><small>${esc(row.phone||'—')}</small></td><td>${esc(row.drink)}</td><td>${row.quantity}</td><td>${esc(row.sugar)}／${esc(row.ice)}</td><td>${esc(row.note||'—')}</td><td>${esc(row.status)}</td></tr>`).join('')}</tbody></table></div>`;target.querySelectorAll('.deliver').forEach(button=>button.onclick=()=>{const rows=localOrders().map(row=>row.orderNo===button.dataset.order?{...row,status:'已發送'}:row);saveLocalOrders(rows);renderOrders(rows,true)})}
$('loadOrders').onclick=()=>renderOrders(localOrders());$('loadDistribution').onclick=()=>renderOrders(localOrders(),true);async function loadMenu(){try{const data=await api('menu');if(data.menu?.length)menu=data.menu}catch{}renderMenu()}renderCart();loadMenu();
</script><script src="menu-images.js"></script></body></html>
